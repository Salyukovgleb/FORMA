name: Backend checks
on:
  pull_request:
  push:
    branches: [main, 'docs/**']
permissions:
  contents: read
concurrency:
  group: phase-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: forma_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forma -d forma_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORMA_TEST_DATABASE_URL: postgresql://forma:contract-test-only@127.0.0.1:5432/forma_contract_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
      - run: .venv/bin/python -m pip install --no-build-isolation --no-deps .
      - run: make ci-local
      - run: git diff --exit-code
