name: FORMA CI
on:
  pull_request:
  push:
    branches: [main, 'docs/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: make lint
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: make typecheck
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: .venv/bin/python -m pytest -q tests/unit
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: forma_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forma -d forma_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORMA_TEST_DATABASE_URL: postgresql://forma:contract-test-only@127.0.0.1:5432/forma_contract_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: .venv/bin/python -m pytest -q tests/api tests/integration
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: forma_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forma -d forma_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORMA_TEST_DATABASE_URL: postgresql://forma:contract-test-only@127.0.0.1:5432/forma_contract_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: make test-migrations
      - run: make schema-check
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: make test-security
      - run: .venv/bin/python -m pip check
      - run: make lock-check
  docs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-python
      - run: make openapi-check
      - run: git diff --exit-code
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check_compose.py
