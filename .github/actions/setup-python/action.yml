name: Install locked Python project
description: Reproducible Python environment for backend quality gates
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - shell: bash
      run: python -m venv .venv
    - shell: bash
      run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
    - shell: bash
      run: .venv/bin/python -m pip install --no-build-isolation --no-deps .
