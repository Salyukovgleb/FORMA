name: forma
services:
  postgres:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U forma -d forma']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
  backend:
    profiles: [tools]
    image: ${FORMA_IMAGE:-forma-backend:local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    volumes:
      - files:/var/lib/forma
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
  api:
    image: ${FORMA_IMAGE:-forma-backend:local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    command: ["python", "-m", "uvicorn", "forma_backend.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      JWT_PREVIOUS_KEY_ID: ${JWT_PREVIOUS_KEY_ID:-}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_ROOT: /var/lib/forma
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/var/lib/forma
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  pgdata:
  files:
