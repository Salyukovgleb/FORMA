[project]
name = "forma-backend"
version = "0.1.0.dev0"
requires-python = ">=3.12"
description = "FORMA modular backend"
dependencies = ["pydantic==2.12.3", "SQLAlchemy==2.0.44", "alembic==1.17.1", "psycopg[binary]==3.2.12"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["F"]
[tool.mypy]
files = ["src", "docs/contracts/models.py"]
strict = true
[tool.pytest.ini_options]
testpaths = ["tests/contracts", "tests/unit"]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forma_backend = ["py.typed"]
